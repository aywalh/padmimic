# Push a tag like v0.2.0 (same as the version in Cargo.toml) to build and publish a release.
# The app's updater downloads padmimic.exe and checks it against padmimic.exe.sha256.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag must match Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo.toml has $v but the tag is ${{ github.ref_name }}" }

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target/release/padmimic.exe padmimic.exe
          $h = (Get-FileHash padmimic.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/padmimic.exe.sha256", "$h  padmimic.exe`n")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" padmimic.exe padmimic.exe.sha256 --title "padmimic ${{ github.ref_name }}" --generate-notes
