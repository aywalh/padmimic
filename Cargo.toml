[package]
name = "padmimic"
version = "0.2.3"
edition = "2024"
description = "Controller remapper for Windows: real gamepad to keyboard, mouse and a virtual Xbox 360 controller"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vigem-client = "0.1.4"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_System_LibraryLoader", "Win32_Media", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input_XboxController", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Controls", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem"] }

image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
